name: Build and Deploy Production

# The pages are rendered at build time with the catalogue as it is then, so besides every push to `production`
# the site is rebuilt on a schedule to pick up new offers. (Scheduled runs use this file from the default branch
# and always build `production`.)
on:
  push:
    branches:
      - production
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_DIR: ${{ vars.APP_DIR || '/opt/sportgearhub-web-landing' }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  LANDING_IMAGE: ${{ vars.LANDING_IMAGE || 'production' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: production

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST SSH_USER SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment configuration::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build (pre-render against the live API)
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://sportgearhub.ru' }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://app.sportgearhub.ru' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.sportgearhub.ru' }}
          VITE_PROVIDER_URL: ${{ vars.VITE_PROVIDER_URL || 'https://crm.sportgearhub.ru' }}
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" --tag "$IMAGE_NAME:$LANDING_IMAGE" .
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:$LANDING_IMAGE"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" docker-compose.yml "$SSH_USER@$DEPLOY_HOST:/tmp/sportgearhub-web-landing-compose.yml"

      - name: Deploy on target host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_USER: ${{ vars.SSH_USER }}
          LANDING_HTTP_PORT: ${{ vars.LANDING_HTTP_PORT || '8002' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' LANDING_IMAGE='$LANDING_IMAGE' LANDING_HTTP_PORT='$LANDING_HTTP_PORT' bash -s" <<'EOF'
          set -euo pipefail

          mkdir -p "$APP_DIR"
          mv /tmp/sportgearhub-web-landing-compose.yml "$APP_DIR/docker-compose.yml"

          cat > "$APP_DIR/.env" <<ENVEOF
          LANDING_IMAGE=$LANDING_IMAGE
          LANDING_HTTP_PORT=$LANDING_HTTP_PORT
          ENVEOF

          docker network inspect apps-proxy >/dev/null 2>&1 || docker network create apps-proxy

          cd "$APP_DIR"
          if docker compose version >/dev/null 2>&1; then
            docker compose pull
            docker compose up -d --remove-orphans
          else
            docker-compose pull
            docker-compose up -d --remove-orphans
          fi
          EOF
