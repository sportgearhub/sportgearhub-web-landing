services:
  sportgearhub-web-landing:
    container_name: sportgearhub-web-landing
    image: "ghcr.io/sportgearhub/sportgearhub-web-landing:${LANDING_IMAGE:-production}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANDING_HTTP_PORT:-8002}:80"
    networks:
      apps-proxy:
        aliases:
          - sportgearhub-web-landing

networks:
  apps-proxy:
    external: true
